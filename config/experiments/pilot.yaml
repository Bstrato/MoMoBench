# Stage: pilot (spec §78 Stage B). All 14 configured real models, 1 repeat,
# against the dev scenario suite. Requires OPENAI_API_KEY / ANTHROPIC_API_KEY
# / TOGETHER_API_KEY and will incur real provider cost — run
# `momobench doctor` first and inspect the pilot traces before estimating
# the cost of the final experiment (spec §94).
#
# claude_sonnet / claude_opus5 temporarily excluded from this roster for
# cost reasons — not removed from config/agents.yaml. Already have pilot
# data for both from the 2026-08-22_pilot_v1 run.

name: pilot_v1

scenario_dir: data/scenarios/dev

agents:
  - gpt-5_6
  - gpt-5_5
  - deepseek
  - qwen
  - llama
  - gemma2
  - glm5_2
  - muse_glimmer
  - qwen3_8
  - deepseek_0813
  - gpt_oss_120b

interface: ussd

repeats: 1

max_steps: 20
max_action_tokens: 128

parallelism:
  openai: 4
  anthropic: 4
  together: 6
