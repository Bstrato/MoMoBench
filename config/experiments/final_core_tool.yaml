# Stage: frozen final core, structured-tool interface (spec §78 Stage C,
# Phase 13 / spec §100-101). Same scenario suite/roster/repeats as
# final_core.yaml — only the interaction layer differs (tool calls instead
# of USSD menu navigation), so the same scenarios can be compared across
# both interfaces. This config has not been run before; validate on one
# cheap model first (--agents glm5_2) before committing the full roster.
#
# claude_sonnet / claude_opus5 temporarily excluded from this roster for
# cost reasons — not removed from config/agents.yaml.

name: final_core_tool_v1

scenario_dir: data/scenarios/public_test

agents:
  - gpt-5_6
  - gpt-5_5
  - deepseek
  - qwen
  - llama
  - gemma2
  - glm5_2
  - muse_glimmer
  - qwen3_8
  - deepseek_0813
  - gpt_oss_120b

interface: tool

repeats: 3

max_steps: 20
max_action_tokens: 128

parallelism:
  openai: 4
  anthropic: 4
  together: 6
