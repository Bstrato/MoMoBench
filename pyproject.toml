[project]
name = "momobench"
version = "0.1.0"
description = "MoMo Bench: a stateful, consequence-aware benchmark for LLM agents operating simulated Ghanaian Mobile Money systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    "openai",
    "anthropic",
    "together",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
momobench = "momobench.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["momobench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# typer.Option(...)/typer.Argument(...) in argument defaults is the required
# Typer CLI declaration pattern, not the mutable-default-argument bug B008
# guards against.
"momobench/cli.py" = ["B008"]
